# Choose one AI backend below and uncomment its section.
# Optional staged progression cap. Omit this section to use General.maxLevel.
; [Progression]
; contentCap = 40
#
#
# [OpenRouter]
# enabled = true
# apiKey = sk-or-v1-your-key-here
# apiUrl = https://openrouter.ai/api/v1/chat/completions
# model = openai/gpt-5.6-luna
# Optional cheap model for ambiguous party-chat routing; empty keeps deterministic routing only.
# partyRouterModel =
# Model API capabilities belong here, not in the runtime code.
# Leave temperature empty when the selected model does not accept it.
# temperature =
# completionLimitParam = max_tokens
# strictSchema = true
# providerOrder = OpenAI
# providerSort = price
# allowFallbacks = false
# requireParameters = true
# debug = true

# Instead of OpenRouter, use any OpenAI-compatible Chat Completions endpoint.
# Remove/rename the [OpenRouter] section above when using this section.
#
# [AI]
# enabled = true
# apiUrl = http://127.0.0.1:1234/v1/chat/completions
# apiKey = lm-studio
# model = exact-model-id
# partyRouterModel = exact-model-id
# temperature = 0.35
# completionLimitParam = max_tokens
# strictSchema = false
# reasoningEffort = off

; Fortress defense requires the disabled population from default.ini.
; Do not override BOT_POPULATION_ENABLED to true; startup rejects it.
; The staged progression cap above must be at least 20.
; [BotPopulation]
; enabled = false
; [ClanSimulation]
; enabled = false

[Langfuse]
enabled = false
envFile =
baseUrl = http://localhost:3000
capturePayloads = true
debug = true
