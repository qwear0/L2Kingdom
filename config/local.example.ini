# apiUrl = http://127.0.0.1:1234/v1/chat/completions
# apiKey = lm-studio
# model = exact-model-id
# partyRouterModel = exact-model-id
# temperature = 0.35
# completionLimitParam = max_tokens
# strictSchema = false
# reasoningEffort = off

; npm start owns the persistent management API, not browser pages/static assets.
; WorldObserver.enabled controls only the game observer API, not management.
; Edit these externally and restart the management owner; in-page Stop affects
; only gameplay. No legacy launcher host/port flags remain.
; [WorldObserver]
; enabled = true
; hostname = 127.0.0.1
; port = 8088
; publicOrigin = http://192.168.1.10:8088
; The origin above is illustrative: use the actual frontend LAN listener.
; publicOrigin must be one HTTP origin with no credentials/path/query/fragment.
; Empty disables proxy trust and browser auto-open; management remains API-only.
; A configured publicOrigin requires management hostname=127.0.0.1. The same-host
; frontend must overwrite X-Real-IP with its connection peer, preserve browser
; Host/Origin and connect to 127.0.0.1 at the retained backend port where possible.
; Frontend bind/subnet enforcement is separate; do not expose either to Internet.
; Direct local MCP still uses the backend port, not publicOrigin.
;
; Optional bot MCP observation/control (game restart required); attach is read-only.
; Supply the same L2NODE_BOT_CONTROL_TOKEN (32..256 base64url characters) to
; management and the stdio bridge through their private environments, never here.
; [BotControl]
; enabled = true
;
; Use Settings for curated local edits. Shared/default files are never UI write targets.
; L2NODE_PROGRESSION_RATE forces the managed preset read-only; otherwise the retained
; launcher-settings.json is the sole next-start preset store. Saves exclude both configs.
; Failed live apply retains the saved value and requires explicit Stop -> Start.
;
; The owned-only runtime restores registered vassals, not the historical bot population.
; Population enabled=true and staticShotsDisabled=false are enforced after overrides.
; Ambient seeding, cold simulation/activation, party/director jobs and ClanSimulation
; stay disabled even when an old local.ini or environment requests them.
; Optional override of hot bot PvP frequency; restart the server to apply.
; [BotPopulation]
; pvpAggression = 0.5
; Range 0..1: 0 disables initiation, 0.5 preserves balance, 1 maximizes eligible escalation.
; Defense and party assistance remain active; zero chances and combat guards remain.
; Lower values favor retreat; higher values accept more risk before retreating.

[Langfuse]
enabled = false
envFile =
baseUrl = http://localhost:3000
capturePayloads = true
debug = true
